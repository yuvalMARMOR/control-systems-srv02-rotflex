<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SRV02 and ROTFLEX control-system overview</title>
  <desc id="desc">Two control paths: SRV02 position tuning and digital flexible-joint control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="1" stop-color="#102c3a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13b8c8"/>
      <stop offset="1" stop-color="#6ee7f2"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#46d5e2"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#f8bd47"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#f5fbff">SRV02 and ROTFLEX Control Systems</text>
  <text x="600" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a8c8d6">MATLAB / Simulink - controller design, hardware models, and recorded experiments</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="515" height="405" rx="24" fill="#0d2230" stroke="#2b6877" stroke-width="2"/>
    <rect x="630" y="145" width="515" height="405" rx="24" fill="#0d2230" stroke="#6f5728" stroke-width="2"/>
  </g>

  <text x="312" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="url(#cyan)">SRV02 Position Control</text>
  <text x="887" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="url(#orange)">SRV02-ROTFLEX Digital Control</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e9f8fb" text-anchor="middle">
    <rect x="92" y="234" width="132" height="62" rx="13" fill="#123846" stroke="#46d5e2"/>
    <text x="158" y="260">Plant model</text><text x="158" y="282" fill="#9dd9df">K / (tau s + 1)</text>
    <rect x="261" y="234" width="132" height="62" rx="13" fill="#123846" stroke="#46d5e2"/>
    <text x="327" y="271">Controller</text>
    <rect x="430" y="234" width="104" height="62" rx="13" fill="#123846" stroke="#46d5e2"/>
    <text x="482" y="260">SRV02</text><text x="482" y="282" fill="#9dd9df">servo</text>
    <path d="M232 265 H253" stroke="#46d5e2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <path d="M401 265 H422" stroke="#46d5e2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d9f4f7">
    <circle cx="117" cy="353" r="7" fill="#46d5e2"/><text x="137" y="359">LQR optimization</text>
    <circle cx="117" cy="399" r="7" fill="#46d5e2"/><text x="137" y="405">Ziegler-Nichols reaction curve</text>
    <circle cx="117" cy="445" r="7" fill="#46d5e2"/><text x="137" y="451">Relay critical-gain tuning</text>
    <circle cx="117" cy="491" r="7" fill="#46d5e2"/><text x="137" y="497">Step, ramp, and disturbance tests</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff8e8" text-anchor="middle">
    <rect x="661" y="234" width="115" height="62" rx="13" fill="#3a2b13" stroke="#f8bd47"/>
    <text x="718" y="260">State-space</text><text x="718" y="282" fill="#f8d995">A, B, C, D</text>
    <rect x="806" y="234" width="115" height="62" rx="13" fill="#3a2b13" stroke="#f8bd47"/>
    <text x="863" y="260">ZOH and</text><text x="863" y="282" fill="#f8d995">pole placement</text>
    <rect x="951" y="234" width="158" height="62" rx="13" fill="#3a2b13" stroke="#f8bd47"/>
    <text x="1030" y="260">ROTFLEX</text><text x="1030" y="282" fill="#f8d995">hardware model</text>
    <path d="M784 265 H798" stroke="#f8bd47" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M929 265 H943" stroke="#f8bd47" stroke-width="3" marker-end="url(#arrow-orange)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fff3d6">
    <circle cx="692" cy="353" r="7" fill="#f8bd47"/><text x="712" y="359">Four-state flexible-joint model</text>
    <circle cx="692" cy="399" r="7" fill="#f8bd47"/><text x="712" y="405">Numerical velocity estimation</text>
    <circle cx="692" cy="445" r="7" fill="#f8bd47"/><text x="712" y="451">Integral tracking action</text>
    <circle cx="692" cy="491" r="7" fill="#f8bd47"/><text x="712" y="497">Sampling-time comparison</text>
  </g>

  <text x="600" y="588" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#93b8c8">Theory - MATLAB implementation - recorded response - engineering interpretation</text>
</svg>
